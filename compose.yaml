services:
  postgres:
    image: 'postgres:latest'
    container_name: postgresdb
    environment:
      - 'POSTGRES_DB=${POSTGRES_DB}'
      - 'POSTGRES_PASSWORD=${POSTGRES_PASSWORD}'
      - 'POSTGRES_USER=${POSTGRES_USER}'
    ports:
      - '5432:5432'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  gatewaycaddy:
    image: 'caddy:latest'
    container_name: 'caddyforportfolio'
    restart: 'always'
    volumes:
      - ${STORAGE2_LOCATION}/Caddyfile:/etc/caddy/Caddyfile
    depends_on:
      app:
        condition: service_healthy

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: 'portfolio'
    pull_policy: build
    container_name: 'portfolioapp'
    environment:
      - 'SERVER_PORT=${SERVER_PORT}'
      - 'JDBC_URL=${JDBC_URL}'
      - 'POSTGRES_DB=${POSTGRES_DB}'
      - 'POSTGRES_USER=${POSTGRES_USER}'
      - 'POSTGRES_PASSWORD=${POSTGRES_PASSWORD}'
      - 'MAIL_USERNAME=${MAIL_USERNAME}'
      - 'MAIL_PASSWORD=${MAIL_PASSWORD}'
      - 'JWT_SECRET=${JWT_SECRET}'
      - 'ADMIN_EMAIL=${ADMIN_EMAIL}'
      - 'ADMIN_PASSWORD=${ADMIN_PASSWORD}'
      - 'MAIL_CONTACT=${MAIL_CONTACT}'
    restart: 'always'
    volumes:
        - ${STORAGE2_LOCATION}/uploads:/uploads
    depends_on:
      - 'postgres'
    ports:
      - '${APP_PORTS}'
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:${SERVER_PORT}/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  tunnel:
    container_name: portfolio-tunnel
    image: cloudflare/cloudflared:latest
    restart: always
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    command: tunnel --no-autoupdate run