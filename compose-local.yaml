name: portfolio-local

services:
  postgres:
    image: 'postgres:latest'
    environment:
      - 'POSTGRES_DB=${POSTGRESLOCAL_DB}'
      - 'POSTGRES_USER=${POSTGRESLOCAL_USER}'
      - 'POSTGRES_PASSWORD=${POSTGRESLOCAL_PASSWORD}'
    ports:
      - '5433:5432'
    volumes:
      - postgresdblocal-data:/var/lib/postgresql

volumes:
  postgresdblocal-data: